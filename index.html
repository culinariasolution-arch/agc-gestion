<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tabi An">
  <title>Tabi An</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de acceso: solo la primera vez -->
  <section id="vista-acceso" class="acceso" hidden>
    <img src="icons/logo.png" alt="Tabi An, tabiquería y obra" class="acceso-logo">
    <h1>Bienvenido</h1>
    <p>Escribe tu clave de acceso. Se guarda en este dispositivo y no te la volverá a pedir.</p>
    <form id="form-acceso">
      <input id="campo-clave" class="campo" type="password" autocomplete="current-password" placeholder="Clave de acceso" required>
      <button type="submit" class="boton">Entrar</button>
      <p id="error-acceso" class="error" hidden></p>
    </form>
  </section>

  <!-- App -->
  <div id="vista-app" hidden>
    <header class="cabecera">
      <div class="marca">
        <img src="icons/logo.png" alt="">
        <h1>Tabi An</h1>
      </div>
      <button id="boton-recargar" class="icono-boton" aria-label="Actualizar">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </header>

    <main id="contenido"></main>

    <nav class="barra">
      <button data-vista="inicio" class="activo">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Inicio</span>
      </button>
      <button data-vista="obras">
        <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>
        <span>Obras</span>
      </button>
      <button data-vista="gastos">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/></svg>
        <span>Gastos</span>
      </button>
      <button data-vista="cobros">
        <svg viewBox="0 0 24 24"><path d="M3 7h18v10H3zM7 12h.01M17 12h.01M12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
        <span>Cobros</span>
      </button>
      <button data-vista="ajustes">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <div id="hoja-fondo" class="hoja-fondo" hidden><div id="hoja" class="hoja" role="dialog" aria-modal="true"></div></div>
  <div id="aviso" class="aviso" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
